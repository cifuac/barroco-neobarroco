<svg class="fig" viewBox="0 0 1700 700" role="img" aria-labelledby="refl-titulo refl-desc">
<title id="refl-titulo">Tres reflejos</title>
<desc id="refl-desc">Tres columnas, cada una con un espejo convexo esquemático (Sarduy 1972, §4 b). Reflejo reductor, propio de todo barroco: el espejo entero quiere totalizar, pero una mancha opaca le resiste. Reflejo significante, del barroco histórico: espejo entero, descentrado pero aún armónico, bajo un anillo de logos exterior (dios, rey). Reflejo estructural, del neobarroco: el espejo se fragmenta alrededor de un hueco, la carencia, y el logos queda como una pantalla; reflejo pulverizado.</desc>

<defs><radialGradient id="refl-vidrio" cx="42%" cy="38%" r="70%"><stop offset="0" style="stop-color:var(--azogue);stop-opacity:.55"/><stop offset=".7" style="stop-color:var(--azogue);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--azogue);stop-opacity:.12"/></radialGradient></defs>
<g opacity=".3"><line class="s-azogue w3" x1="567" y1="40" x2="567" y2="660"/><line class="s-azogue w3" x1="1133" y1="40" x2="1133" y2="660"/></g>
<g data-from="1">
<circle cx="283" cy="236" r="100" fill="url(#refl-vidrio)"/><circle class="f-none s-nacar w4" cx="283" cy="236" r="118"/><circle class="f-none s-nacar w3" opacity=".45" cx="283" cy="236" r="106"/><path class="f-none s-perla w3 redondo" opacity=".55" d="M233.7 173 A80 80 0 0 0 206.9 211.3"/><path class="f-tinta" d="M335.7 268.6 Q334.3 279.2 324.3 283.5 Q314.3 287.8 303.1 287.6 Q292 287.4 284.4 278.5 Q276.8 269.7 280.9 259.5 Q285 249.3 290.8 242.9 Q296.7 236.6 306.1 228.8 Q315.5 221 323.2 230.3 Q330.9 239.7 334 248.8 Q337.2 258 335.7 268.6 Z"/>
<text class="neo f-perla" x="283" y="444" font-size="40" text-anchor="middle">Reductor</text>
<text class="it f-azogue" x="283" y="484" font-size="30" text-anchor="middle">todo barroco</text>
<text class="f-nacar" x="283" y="546" font-size="28" text-anchor="middle">quiere ser totalizante y minucioso;</text>
<text class="f-nacar" x="283" y="582" font-size="28" text-anchor="middle">algo «le opone su opacidad»</text>
<text class="neo f-cian" x="283" y="632" font-size="28" text-anchor="middle">§4 b</text>
</g>
