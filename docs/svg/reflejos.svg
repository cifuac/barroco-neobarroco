<text class="neo f-perla" x="850" y="444" font-size="40" text-anchor="middle">Significante</text>
<text class="it f-azogue" x="850" y="484" font-size="30" text-anchor="middle">barroco histórico</text>
<text class="f-nacar" x="850" y="546" font-size="28" text-anchor="middle">descentrado «pero aún armónico»;</text>
<text class="f-nacar" x="850" y="582" font-size="28" text-anchor="middle">logos exterior: dios, rey</text>
<text class="neo f-cian" x="850" y="632" font-size="28" text-anchor="middle">§4 b</text>
