<svg class="fig" viewBox="0 0 1500 620" role="img" aria-labelledby="ret-titulo ret-desc">
<title id="ret-titulo">Retombée: parecidos sin causa</title>
<desc id="ret-desc">A la izquierda, la elipse de Kepler (1609) con el sol en un foco y el otro foco vacío. A la derecha, la planta oval de San Carlo alle Quattro Fontane (Borromini, 1634-41), en esquema; es un ejemplo añadido. Entre ambas, ondas concéntricas sin flecha. Paso 1: aparece una flecha de causa a efecto. Paso 2: la flecha se tacha en bermellón y aparece el rótulo «retombée: causalidad acrónica, isomorfía no contigua» (Sarduy 1974, citado por Díaz 2011, ap. 6).</desc>

