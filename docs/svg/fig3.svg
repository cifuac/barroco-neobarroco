<svg class="fig" viewBox="0 0 1600 420" role="img" aria-labelledby="fig3-titulo fig3-desc">
<title id="fig3-titulo">Figura 3 de Sarduy (1972): permutación y condensación</title>
<desc id="fig3-desc">Dos esquemas lado a lado. A la izquierda, «Permutación»: la cadena «Fonema 1… Fonema 2… etc.» bajo un corchete rotulado «Significante 1» y la cadena «F 1… F 2… etc.» bajo otro corchete rotulado «Snte. 2»; ambos sobre una única barra larga con «Significado» debajo: dos cadenas fonéticas y un solo significado. A la derecha, «Condensación»: Snte. 1 y Snte. 2 a los lados de un signo central, Snte. 3 sobre Sdo.; entre cada lado y el centro, un par de flechas opuestas. Paso 1: «vaya un gallo» y «valla un gayo» intercambian y y ll. Paso 2: AMO, AMOSCLAVO, ESCLAVO. Paso 3: MÁQUINA, MAQUINOSCRITO, MANUSCRITO (Cabrera Infante, §2 c).</desc>

