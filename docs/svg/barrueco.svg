<svg class="fig" viewBox="0 0 1500 620" role="img" aria-labelledby="barrueco-titulo barrueco-desc">
<title id="barrueco-titulo">Barrueco: los étimos de «barroco» sobre un arco abierto</title>
<desc id="barrueco-desc">La palabra «barroco» en el centro. Alrededor, un arco punteado abierto que termina en punta de flecha y «etc.»; sobre él aparecen, uno por paso, seis étimos o definiciones que Sarduy acumula (§1): la perla irregular (barrueco, berrueco), la roca o nódulo, el pintor Barocci, alumno de los Carracci, el silogismo escolástico Baroco, la «bizarrería chocante» de Littré y «lo estrambótico… el mal gusto» de Martínez Amador. Aparte, fuera del arco: «barro», juego fónico (§1), no étimo.</desc>

<g>
<path class="f-none s-nacar w3" style="stroke-dasharray:14 10" d="M498.1 512.2 A262 262 0 1 1 1001.9 512.2"/>
<path class="f-nacar" d="M994.7 537.2 L992.2 509.5 L1000.3 517.7 L1011.5 515 Z"/>
<text class="f-nacar" x="1045.9" y="552.2" font-size="40">etc.</text>
<text class="serif it f-perla" x="750" y="462" font-size="104" text-anchor="middle">barroco</text>
</g>
