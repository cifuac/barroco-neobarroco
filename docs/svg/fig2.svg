<svg class="fig" viewBox="0 0 1200 620" role="img" aria-labelledby="fig2-titulo fig2-desc">
<title id="fig2-titulo">Figura 2 de Sarduy (1972): la proliferación</title>
<desc id="fig2-desc">En el centro, el significante (Snte.) tachado sobre el significado (Sdo.). Alrededor, un arco punteado abierto por abajo, más o menos la mitad superior de una circunferencia, pasa por Snte. 1, Snte. 2, Snte. 3, Snte. 4 y Snte. 5 y termina en una punta de flecha seguida de «etc.»; el arco nunca se cierra. Paso 1: sobre Snte. 1 a 4, el ejemplo de Carpentier (reloj de sol con horas de luna, balanza que pesa gatos, telescopio por la luceta rota, astrónomo en lo alto de un armario; §2 b). Paso 2, añadido didáctico: rayos de la lectura radial apuntan hacia el centro y el Sdo. se rotula «desorden».</desc>

