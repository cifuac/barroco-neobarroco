<svg class="fig" viewBox="0 0 1728 760" role="img" aria-labelledby="sint-titulo sint-desc">
<title id="sint-titulo">Seis síntomas de un corte epistémico</title>
<desc id="sint-desc">Seis pictogramas, cada uno con un estado anterior en gris y el posterior en color (Sarduy 1972, §1). Iglesia: del eje único a varios trayectos, un laberinto. Ciudad: pierde su trama ortogonal y sus fosos, ríos y murallas; queda una trama irregular. Literatura: el renglón recto se enrosca, deja el nivel denotativo. Astros: del círculo con un centro a la elipse de Kepler con dos focos, uno vacío. Harvey: la circulación de la sangre. Dios: el punto central se dispersa en cogitos y mónadas.</desc>

