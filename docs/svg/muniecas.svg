<svg class="fig" viewBox="0 0 1400 780" role="img" aria-labelledby="mun-titulo mun-desc">
<title id="mun-titulo">La metáfora al cuadrado: muñecas rusas</title>
<desc id="mun-desc">Marcos anidados e incompletos, abiertos en una esquina, que aparecen de dentro hacia fuera (Sarduy 1972, §2). 0: nivel denotativo, supuesto, un núcleo punteado con la palabra «halcones». 1: la metáfora poética. 2: Góngora, Soledades: «raudos torbellinos de Noruega». 3: Dámaso Alonso, 1956, que la descifra. 4: Sarduy, 1972, que comenta a Alonso. 5: Díaz, 2011, que anota a Sarduy. 6: esta clase.</desc>

