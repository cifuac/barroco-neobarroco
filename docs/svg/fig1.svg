<line class="s-bermellon w4 redondo" x1="107" y1="144" x2="243" y2="123"/>
<line class="s-nacar w3" x1="103" y1="170" x2="247" y2="170"/>
<text class="f-oro" x="175" y="226" font-size="56" text-anchor="middle">Sdo.</text>
<line class="s-nacar w3" style="stroke-dasharray:24 16" x1="290" y1="170" x2="826" y2="170"/>
