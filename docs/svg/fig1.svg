<ellipse cx="592" cy="214" rx="612" ry="178" fill="url(#fig1-halo)"/>
<path class="f-none s-azogue w3 redondo" opacity=".75" d="M64 84 Q14 214 64 344"/>
<path class="f-none s-azogue w3 redondo" opacity=".75" d="M1150 84 Q1198 214 1150 344"/>
<text class="neo f-azogue" x="600" y="44" font-size="32" text-anchor="middle">contexto <tspan class="f-cian" font-size="28">· §2 a</tspan></text>
<text class="neo f-azogue" x="1190" y="386" font-size="28" text-anchor="end">añadido didáctico</text>
</g>
<g>
