<svg class="fig" viewBox="0 0 1200 400" role="img" aria-labelledby="fig1-titulo fig1-desc">
<title id="fig1-titulo">Figura 1 de Sarduy (1972): la sustitución</title>
<desc id="fig1-desc">A la izquierda, una fracción: el significante (Snte.) tachado sobre la barra y el significado (Sdo.) debajo. Desde la barra sale hacia la derecha una flecha punteada larga que termina en «Snte. 1», solo y lejos, sin barra y sin significado debajo. Paso 1: bajo Sdo., «virilidad»; bajo Snte. 1, «el aguijón del leptosomático macrogenitoma» (Lezama, Paradiso, §2 a). Paso 2, añadido didáctico: un halo del contexto (§2 a) envuelve a distancia los dos términos.</desc>

<defs><radialGradient id="fig1-halo" cx="50%" cy="50%" r="50%"><stop offset="0" style="stop-color:var(--azogue);stop-opacity:.20"/><stop offset=".62" style="stop-color:var(--azogue);stop-opacity:.09"/><stop offset="1" style="stop-color:var(--azogue);stop-opacity:0"/></radialGradient></defs>
