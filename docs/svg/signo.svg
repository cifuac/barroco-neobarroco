<svg class="fig" viewBox="0 0 1400 600" role="img" aria-labelledby="signo-titulo signo-desc">
<title id="signo-titulo">El signo y su distancia</title>
<desc id="signo-desc">A la izquierda, el signo clásico: significante (Snte.) y significado (Sdo.) adheridos por una barra corta. A la derecha, el signo barroco: Snte. y Sdo. separados por una grieta dorada, la «abertura, falla» entre lo nombrante y lo nombrado (Sarduy 1972, §2 a); la distancia exagerada es una hipérbole.</desc>

