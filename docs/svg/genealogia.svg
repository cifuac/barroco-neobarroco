<svg class="fig" viewBox="0 0 1600 520" role="img" aria-labelledby="gen-titulo gen-desc">
<title id="gen-titulo">Genealogía del nombre: del Barroco al Transbarroco</title>
<desc id="gen-desc">Un arco punteado abierto que termina en punta de flecha y «etc.». Sobre él aparecen, uno por paso, los nombres que según Díaz (2011, nota 13, ap. 4) se engendran uno a otro: Barroco; Neobarroco (Haroldo de Campos 1955, Sarduy 1972); Neobarroso (Perlongher); Neoborroso (Kamenszain); Hiperbarroco; Transbarroco (Haroldo de Campos 2004).</desc>

<g>
